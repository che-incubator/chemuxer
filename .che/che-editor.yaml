# Chemuxer editor definition template.
# CI replaces quay.io/che-incubator/chemuxer:pr-83 with the PR-tagged image.
#
# Pattern:
#   1. preStart init container copies chemuxer bundle into shared volume
#   2. container-contribution merges volume + endpoint into the workspace container
#   3. workspace entrypoint runs chemuxer from /chemuxer-vol/

schemaVersion: 2.1.0
metadata:
  name: chemuxer-editor
commands:
  - id: init-chemuxer
    apply:
      component: chemuxer-injector
events:
  preStart:
    - init-chemuxer
components:
  - name: chemuxer-injector
    container:
      image: quay.io/che-incubator/chemuxer:pr-83
      command:
        - sh
        - -c
        - |
          mkdir -p /chemuxer-vol/dist/server /chemuxer-vol/dist/client &&
          cp -r /app/dist/server/* /chemuxer-vol/dist/server/ &&
          cp -r /app/dist/client/* /chemuxer-vol/dist/client/ &&
          cp -r /app/node_modules /chemuxer-vol/node_modules
      volumeMounts:
        - name: chemuxer-volume
          path: /chemuxer-vol
      memoryLimit: 128Mi
      memoryRequest: 32Mi
      cpuLimit: 500m
      cpuRequest: 30m
  - name: chemuxer-runtime
    attributes:
      controller.devfile.io/container-contribution: true
    container:
      image: quay.io/che-incubator/chemuxer:pr-83
      memoryLimit: 128Mi
      memoryRequest: 32Mi
      cpuLimit: 500m
      cpuRequest: 30m
      endpoints:
        - name: chemuxer
          targetPort: 7681
          exposure: public
          protocol: https
          attributes:
            type: main
            cookiesAuthEnabled: true
            discoverable: false
            urlRewriteSupported: true
      volumeMounts:
        - name: chemuxer-volume
          path: /chemuxer-vol
  - name: chemuxer-volume
    volume:
      ephemeral: true
