name: Pull Request Check

on:
  pull_request:
    branches: [main]

env:
  IMAGE: quay.io/che-incubator/chemuxer

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build -w packages/shared

      - run: npm test -w packages/shared -w packages/chemuxer

  build-mcp-image:
    name: Build chemuxer-mcp image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build (no push for PRs)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/chemuxer-mcp/Dockerfile
          push: false
          tags: chemuxer-mcp:test

  build-image:
    name: Build and push PR image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Quay.io
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/chemuxer/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:pr-${{ github.event.pull_request.number }}

      - name: Post image comment
        uses: actions/github-script@v7
        with:
          script: |
            const tag = `${{ env.IMAGE }}:pr-${{ github.event.pull_request.number }}`;
            const marker = '<!-- chemuxer-image-comment -->';
            const body = [
              marker,
              '### Image built',
              '',
              '```',
              tag,
              '```',
              '',
              '```bash',
              `docker run --rm -p 7681:7681 ${tag}`,
              '```',
            ].join('\n');

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              },
            );
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
