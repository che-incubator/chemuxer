name: Pull Request Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

env:
  IMAGE: quay.io/che-incubator/chemuxer
  MCP_IMAGE: quay.io/che-incubator/chemuxer-mcp

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build -w packages/shared

      - run: npm test -w packages/shared -w packages/chemuxer

  build-mcp-image:
    name: Build and push PR MCP image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to Quay.io
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: packages/chemuxer-mcp/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.MCP_IMAGE }}:pr-${{ github.event.pull_request.number }}

      - name: Post MCP image comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const tag = `${{ env.MCP_IMAGE }}:pr-${{ github.event.pull_request.number }}`;
            const marker = '<!-- chemuxer-mcp-image-comment -->';
            const body = [
              marker,
              '### MCP image built',
              '',
              '```',
              tag,
              '```',
              '',
              '```bash',
              `# On-cluster (SSE)`,
              `kubectl set image deployment/chemuxer-mcp chemuxer-mcp=${tag} -n <namespace>`,
              '',
              `# Local (stdio)`,
              `claude mcp add chemuxer-mcp -- node packages/chemuxer-mcp/dist/index.js --namespace <namespace>`,
              '```',
            ].join('\n');

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              },
            );
            const existing = comments.find(c =>
              c.user?.login === 'github-actions[bot]' &&
              c.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  build-image:
    name: Build and push PR image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to Quay.io
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: packages/chemuxer/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:pr-${{ github.event.pull_request.number }}

      - name: Post image comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const tag = `${{ env.IMAGE }}:pr-${{ github.event.pull_request.number }}`;
            const marker = '<!-- chemuxer-image-comment -->';
            const body = [
              marker,
              '### Image built',
              '',
              '```',
              tag,
              '```',
              '',
              '```bash',
              `docker run --rm -p 7681:7681 ${tag}`,
              '```',
            ].join('\n');

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              },
            );
            const existing = comments.find(c =>
              c.user?.login === 'github-actions[bot]' &&
              c.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Create preview branch
        id: preview-branch
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Extract PR number
          PR_NUMBER=${{ github.event.pull_request.number }}
          PREVIEW_BRANCH="preview/pr-${PR_NUMBER}"
          
          # Switch to or create the preview branch based on the current PR commit
          git checkout -b ${PREVIEW_BRANCH}
          
          # Update the editor definition with the newly built PR image
          TAG="${{ env.IMAGE }}:pr-${PR_NUMBER}"
          sed -i "s|__CHEMUXER_IMAGE__|${TAG}|g" .che/che-editor-template.yaml
          mv .che/che-editor-template.yaml .che/che-editor.yaml
          
          # Commit and force push the preview branch
          git add .che/che-editor.yaml
          git commit -m "chore: setup preview workspace for PR #${PR_NUMBER}"
          git push -f origin ${PREVIEW_BRANCH}

      - name: Post test workspace comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const prNumber = ${{ github.event.pull_request.number }};
            const previewBranch = `preview/pr-${prNumber}`;
            const marker = '<!-- chemuxer-test-workspace-comment -->';

            const body = [
              marker,
              '### Test this PR in a DevWorkspace',
              '',
              'Open a workspace with this PR build — replace `<CHE_HOST>` with your Che dashboard URL:',
              '',
              '```',
              `https://<CHE_HOST>/#https://github.com/${context.repo.owner}/${context.repo.repo}/tree/${previewBranch}?che-editor=https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/${previewBranch}/.che/che-editor.yaml`,
              '```',
            ].join('\n');

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              },
            );
            const existing = comments.find(c =>
              c.user?.login === 'github-actions[bot]' &&
              c.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
