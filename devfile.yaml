schemaVersion: 2.3.0
metadata:
  name: chemuxer-preview

attributes:
  controller.devfile.io/storage-type: per-workspace

components:
  - name: chemuxer
    container:
      image: quay.io/devfile/universal-developer-image:ubi9-latest
      memoryRequest: 512Mi
      memoryLimit: 1Gi
      command: ["/bin/bash", "-c"]
      args:
        - |
          if ! whoami &>/dev/null; then
            echo "user:x:$(id -u):0:user:/home/user:/bin/bash" >> /etc/passwd
          fi
          export HOME=/home/user
          cd $HOME
          export STATIC_DIR=/chemuxer-vol/dist/client
          exec node /chemuxer-vol/dist/server/server.js
      endpoints:
        - name: chemuxer
          targetPort: 7681
          exposure: public
          protocol: https
          attributes:
            type: main
            cookiesAuthEnabled: true
            discoverable: false
            urlRewriteSupported: true
