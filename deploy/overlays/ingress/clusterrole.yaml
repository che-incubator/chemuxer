apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: chemuxer-mcp-auth
  labels:
    app: chemuxer-mcp
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: chemuxer-mcp-auth
  labels:
    app: chemuxer-mcp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: chemuxer-mcp-auth
subjects:
  - kind: ServiceAccount
    name: chemuxer-mcp
    namespace: default
