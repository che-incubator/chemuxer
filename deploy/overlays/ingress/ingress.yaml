apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chemuxer-mcp
  labels:
    app: chemuxer-mcp
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chemuxer-mcp
                port:
                  number: 3001
  tls: []
