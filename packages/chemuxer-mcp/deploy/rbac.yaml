apiVersion: v1
kind: ServiceAccount
metadata:
  name: chemuxer-mcp
  labels:
    app: chemuxer-mcp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chemuxer-mcp
  labels:
    app: chemuxer-mcp
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chemuxer-mcp
  labels:
    app: chemuxer-mcp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chemuxer-mcp
subjects:
  - kind: ServiceAccount
    name: chemuxer-mcp
